name: Readability report

# **What it does**: Analyzes readability of rendered content for changed Markdown files in pull requests
# **Why we have it**: We want to track and improve the readability of our documentation over time
# **Who does it impact**: Contributors and content writers

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull request number to analyze (must be mergeable)'
        required: true
        type: number

permissions:
  contents: read

jobs:
  readability-analysis:
    if: github.repository == 'github/docs-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_report: ${{ steps.report.outputs.has_report }}
    steps:
      - name: Check out selected PR merge commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: refs/pull/${{ inputs.pull_request_number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Render and analyze changed pages
        id: report
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=AMR HEAD^1 HEAD -- ':(glob)content/**/*.md' > "$RUNNER_TEMP/readability-paths"
          mapfile -d '' -t paths < "$RUNNER_TEMP/readability-paths"
          if (( ${#paths[@]} == 0 )); then
            exit 0
          fi

          # Stream only tracked PR files into a disposable container. Do not mount the
          # runner workspace or forward credentials (including the Actions cache token).
          # Keep untrusted container output out of the runner's workflow command stream.
          git archive HEAD | docker run --rm -i \
            --user node --cap-drop ALL --security-opt no-new-privileges \
            node:24-bookworm@sha256:49f7adaf9f1574bc45c20ea317139b39a59d7e758d0e93745e112fd85cb42623 \
            bash -euc '
              cd "$(mktemp -d)"
              tar -xf -
              npm ci >&2
              npx --no-install next telemetry disable >&2
              npm start >&2 &
              GITHUB_ACTIONS=true npm run readability-report -- --paths "$@" >&2
              if [[ -f readability-report.md ]]; then
                cat readability-report.md
              fi
            ' bash "${paths[@]}" 2> "$RUNNER_TEMP/readability.log" |
            head -c 65001 > "$RUNNER_TEMP/readability-body.md"

          if [[ -s "$RUNNER_TEMP/readability-body.md" ]]; then
            if (( $(wc -c < "$RUNNER_TEMP/readability-body.md") > 65000 )); then
              echo 'Readability report is too large to post as a PR comment.'
              exit 1
            fi
            {
              printf '%s\n' '<!-- READABILITY_REPORT -->'
              cat "$RUNNER_TEMP/readability-body.md"
            } > "$RUNNER_TEMP/readability-report.md"
            echo 'has_report=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload report
        if: steps.report.outputs.has_report == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: readability-report
          path: ${{ runner.temp }}/readability-report.md
          if-no-files-found: error

  publish-report:
    if: github.repository == 'github/docs-internal' && needs.readability-analysis.outputs.has_report == 'true'
    needs: readability-analysis
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download report
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: readability-report
          path: ${{ runner.temp }}/readability

      - name: Find existing readability comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
        id: findComment
        with:
          issue-number: ${{ inputs.pull_request_number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- READABILITY_REPORT -->'

      - name: Create or update readability comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          comment-id: ${{ steps.findComment.outputs.comment-id }}
          issue-number: ${{ inputs.pull_request_number }}
          body-path: ${{ runner.temp }}/readability/readability-report.md
          edit-mode: replace
